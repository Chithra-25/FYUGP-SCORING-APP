<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='mcq/result_background.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            text-align: center;
            color: red;
        }

        h1 {
            margin-top: 50px;
            color: #FFD700; /* Gold color */
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .result-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 50px;
        }

        p {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score {
            font-size: 2rem;
            color:rgb(56, 241, 9);
        }

        .feedback {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Styled Yellow Buttons */
        .button {
            padding: 10px 20px;
            background-color: #FFD700; /* Yellow color */
            color: black; /* Black text for contrast */
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.1rem;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }

        .button:hover {
            background-color: #FFC107; /* Slightly darker yellow on hover */
        }
    </style>
</head>
<body>
    <h1>Quiz Results</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% else %}
        <p>Congratulations, <strong>{{ name }}</strong>! 🎉</p>
        <p>Your Score: <strong class="score">{{ score }}</strong> out of <strong>{{ total }}</strong></p>

        <br>

        <!-- ✅ Yellow "Download Results" Button -->
        <a href="{{ url_for('mcq.download_results') }}" class="button">📥 Download Results</a>

        <br><br>

        <!-- ✅ Yellow "Go Back to Home" Button -->
        <a href="{{ url_for('home') }}" class="button">🔙 Go Back to Home</a>
    {% endif %}
</body>
</html>
