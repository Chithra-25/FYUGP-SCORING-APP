<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python MCQ Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-image: url('https://source.unsplash.com/1600x900/?technology,coding'); /* Background Image */
            background-size: cover;
            background-position: center;
            color: white;
        }
        h1 {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
        }
        form {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        fieldset {
            border: none;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin: 5px 0;
        }
        button {
            padding: 10px 15px;
            background: #28a745; /* Green Button */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 5px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <h1>Python MCQ Quiz</h1>

    <form method="POST">
        {% for i, mcq in enumerate(mcqs) %}
            <p><strong>Q{{ i+1 }}: {{ mcq["Question"] }}</strong></p>
    
            {% for j in range(4) %}
                <input type="radio" id="q{{ i }}_{{ j }}" name="q{{ i }}" value="{{ j }}"
                {% if selected_answers.get("q" ~ i) == j|string %} checked {% endif %}>
                
                <label for="q{{ i }}_{{ j }}">{{ mcq["Option " ~ (j+1)] }}</label><br>
            {% endfor %}
            
            <br>
        {% endfor %}
    
        <button type="submit">Submit Quiz</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
