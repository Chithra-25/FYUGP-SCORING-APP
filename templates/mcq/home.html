<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz Portal</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='mcq/mcq_login_background.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 50px;
            color: #FFD700; /* Gold color */
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        form {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 50px;
        }

        label, input, button {
            display: block;
            margin: 10px auto;
            font-size: 1rem;
        }

        input {
            padding: 10px;
            width: 80%;
            max-width: 300px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.1rem;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Python MCQ Quiz</h1>


    <form action="{{ url_for('mcq.home') }}" method="POST">
        <label for="reg_no">Enter your Register Number:</label>
        <input type="text" id="reg_no" name="reg_no" required>
        <br><br>

        <label for="password">Enter your Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Start Quiz</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
