<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='essay/upload.jpg') }}");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Your Files</h2>
        <form action="{{ url_for('essay.upload_file') }}" method="POST" enctype="multipart/form-data">
            <input type="file" name="questions" required>
            <input type="file" name="responses" required>
            <br><br>
            <button type="submit">Upload and Process</button>
        </form>
    </div>
</body>
</html>
